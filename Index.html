<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLOW - Escalonamento de Filas SETIC</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #e2e8f0; color: #2d3748; }

    .header {
      background: linear-gradient(145deg, #0d253f, #1a4a7a);
      color: #ffffff;
      padding: 35px 20px 45px 20px;
      text-align: center;
      position: relative;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .logo-container {
      position: absolute; top: 15px; left: 20px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(145deg, #0a1e33, #113254);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px; padding: 6px 14px; max-width: 220px; min-height: 55px;
    }
    .logo-container img { max-height: 48px; max-width: 100%; object-fit: contain; }
    .logo-placeholder-text { font-size: 0.72rem; font-weight: 700; color: #cbd5e1; text-transform: uppercase; }

    .top-right-nav {
      position: absolute; top: 15px; right: 20px;
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }

    .btn-base, .btn-admin, .btn-add, .btn-change-logo, .btn-change-pass {
      padding: 8px 16px; border-radius: 20px; font-size: 0.8rem; font-weight: 700;
      cursor: pointer; text-decoration: none; border: none; transition: all 0.15s;
    }

    .btn-base-publica { background: linear-gradient(145deg, #f04898, #d62d7a); color: white; }
    .btn-base-privada { background: linear-gradient(145deg, #00d2ff, #0099cc); color: white; }
    .btn-admin { background: linear-gradient(145deg, #3a506b, #1c2d42); color: white; }
    .btn-add { background: linear-gradient(145deg, #2ecc71, #27ae60); color: white; display: none; }
    .btn-change-logo { background: linear-gradient(145deg, #ffaa00, #e67e22); color: white; display: none; }
    .btn-change-pass { background: linear-gradient(145deg, #8e44ad, #6c3483); color: white; display: none; }

    .header h1 { font-size: 2.2rem; margin-top: 10px; margin-bottom: 6px; letter-spacing: 1px; }
    .header p { font-size: 0.95rem; opacity: 0.9; margin-bottom: 25px; }

    .search-box { max-width: 650px; margin: 0 auto; }
    .search-input {
      width: 100%; padding: 15px 25px; font-size: 1rem; border: none;
      border-radius: 30px; outline: none; background: #ffffff;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }

    .container { max-width: 1250px; margin: 35px auto; padding: 0 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 25px; }
    .card {
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      border-radius: 14px; padding: 22px; box-shadow: 0 10px 20px rgba(0,0,0,0.08);
      display: flex; flex-direction: column; justify-content: space-between;
      border-top: 5px solid #1a4a7a; position: relative; transition: all 0.3s;
    }
    .card:hover { transform: translateY(-8px); box-shadow: 0 18px 30px rgba(0,0,0,0.15); }

    .card-actions { display: none; position: absolute; top: 12px; right: 12px; gap: 6px; }
    .btn-card { border: none; padding: 5px 10px; border-radius: 6px; font-size: 0.72rem; font-weight: 700; cursor: pointer; color: white; }
    .btn-edit { background: linear-gradient(145deg, #f1c40f, #f39c12); color: #111; }
    .btn-delete { background: linear-gradient(145deg, #e74c3c, #c0392b); }

    .card-title { font-size: 1.2rem; font-weight: 800; color: #0d253f; }
    .badge-access { background: #e2e8f0; color: #1e293b; font-size: 0.72rem; font-weight: 800; padding: 4px 10px; border-radius: 12px; }
    .card-desc { font-size: 0.875rem; color: #475569; margin: 10px 0 14px 0; }
    .btn-link {
      display: inline-block; text-align: center; background: linear-gradient(145deg, #1a4a7a, #0d253f);
      color: white; text-decoration: none; padding: 8px 14px; border-radius: 8px; font-size: 0.8rem; font-weight: 700; margin-bottom: 14px;
    }

    .flow-container { border-top: 2px dashed #cbd5e1; padding-top: 14px; margin-top: 12px; }
    .flow-title { font-size: 0.72rem; text-transform: uppercase; color: #64748b; font-weight: 800; margin-bottom: 12px; }
    .flow-step { background: #ffffff; border-left: 4px solid #1a4a7a; padding: 10px 14px; border-radius: 6px; margin-bottom: 10px; font-size: 0.825rem; }
    .flow-step.level-1 { border-left-color: #64748b; background: #f1f5f9; }
    .step-level { font-weight: 800; color: #1a4a7a; }
    .step-queue { font-weight: 700; color: #0f172a; }
    .step-resp { color: #475569; margin-top: 4px; font-size: 0.8rem; }

    .obs-box { margin-top: 12px; background: #fff9c4; border: 1px solid #ffe082; padding: 10px; border-radius: 8px; font-size: 0.775rem; color: #7f6000; }
    .status-msg { text-align: center; padding: 40px; font-size: 1.1rem; color: #64748b; font-weight: 600; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000;
    }
    .modal { background: #ffffff; padding: 28px; border-radius: 16px; width: 100%; max-width: 650px; max-height: 90vh; overflow-y: auto; }
    .modal h3 { margin-bottom: 18px; color: #0d253f; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 5px; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; }

    .fluxo-section { border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px; background: #f8fafc; margin-top: 18px; }
    .fluxo-section-header { display: flex; justify-content: space-between; margin-bottom: 12px; }
    .btn-add-fluxo { background: #0072ff; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 700; cursor: pointer; }
    .fluxo-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .fluxo-row input { padding: 8px; font-size: 0.825rem; border: 1px solid #cbd5e1; border-radius: 6px; }
    .fluxo-col-nivel { flex: 1.2; } .fluxo-col-fila { flex: 2; } .fluxo-col-resp { flex: 2.5; }
    .btn-remove-fluxo { background: #ff4b2b; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }

    .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 22px; }
    .btn-sec { background: #64748b; color: white; border: none; padding: 9px 18px; border-radius: 8px; cursor: pointer; font-weight: 700; }
    .btn-pri { background: #0d253f; color: white; border: none; padding: 9px 18px; border-radius: 8px; cursor: pointer; font-weight: 700; }

    :root {
      --ink: #18334f;
      --deep: #082e52;
      --teal: #1268a8;
      --mint: #dcecff;
      --lime: #c1e86b;
      --coral: #f18469;
      --paper: #f1f5f9;
      --line: #d6e1ed;
    }
    body { font-family: "Trebuchet MS", "Segoe UI", sans-serif; color: var(--ink); background: radial-gradient(ellipse at 12% 12%, rgba(193,232,107,.18), transparent 32%), radial-gradient(ellipse at 88% 38%, rgba(18,104,168,.12), transparent 34%), var(--paper); }
    .header { padding: 88px 20px 38px; background: linear-gradient(135deg, #082b4e 0%, #105d9b 58%, #1477bd 100%); box-shadow: 0 16px 42px rgba(8,46,82,.24); }
    .header h1 { color: #fff; }
    .logo-container { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.28); box-shadow: inset 0 1px rgba(255,255,255,.18); }
    .btn-base-publica { background: var(--coral); }
    .btn-base-privada { background: var(--lime); color: var(--deep); }
    .btn-admin { background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.28); }
    .btn-add { background: var(--lime); color: var(--deep); }
    .btn-change-logo { background: var(--coral); }
    .btn-change-pass { background: #e7f2ee; color: var(--deep); }
    .btn-backup { display: none; background: #e7f2ee; color: var(--deep); }
    .search-input { border-radius: 12px; box-shadow: 0 12px 28px rgba(8,40,36,.22); }
    .container { margin-top: 30px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 22px; perspective: 1400px; }
    .card { border: 1px solid rgba(23,58,54,.09); border-top: 4px solid var(--teal); border-radius: 8px; background: linear-gradient(145deg, #fff 0%, #f7fbf9 72%, #edf6f2 100%); box-shadow: 0 10px 24px rgba(16,47,44,.1), 0 2px 5px rgba(16,47,44,.05); transform: perspective(1100px) rotateX(var(--rotate-x, 0deg)) rotateY(var(--rotate-y, 0deg)); transform-style: preserve-3d; transition: transform .18s ease-out, box-shadow .25s ease, border-color .25s ease; }
    .card:hover { transform: perspective(1100px) translateY(-5px) rotateX(var(--rotate-x, 0deg)) rotateY(var(--rotate-y, 0deg)); border-color: rgba(22,124,117,.34); box-shadow: 0 22px 36px rgba(16,47,44,.17), 0 5px 12px rgba(16,47,44,.08); }
    .card > div, .card-title, .badge-access, .flow-step { transform: translateZ(12px); }
    .card-title, .step-level { color: var(--deep); }
    .badge-access { background: var(--mint); color: var(--deep); border-radius: 4px; }
    .btn-link { background: var(--teal); border-radius: 5px; }
    .flow-container { border-top-color: var(--line); }
    .flow-step { border-left-color: var(--teal); background: #fff; }
    .flow-step.level-1 { border-left-color: var(--coral); background: #fff4ef; }
    .obs-box { background: #fff3df; border-color: #f3d293; color: #76500c; }
    .modal { border-radius: 8px; box-shadow: 0 26px 70px rgba(7,35,32,.28); }
    .modal h3 { color: var(--deep); }
    .form-group input:focus, .form-group textarea:focus, .fluxo-row input:focus { outline: 3px solid rgba(22,124,117,.18); border-color: var(--teal); }
    .btn-pri, .btn-add-fluxo { background: var(--teal); }
    .btn-sec { background: #71847e; }
    button, a { transition: transform .18s ease, filter .18s ease, box-shadow .18s ease; }
    button:hover, a:hover { filter: brightness(1.06); }
    button:active, a:active { transform: translateY(1px); }
    @media (hover: none), (pointer: coarse) {
      .card, .card:hover { transform: none; }
      .card > div, .card-title, .badge-access, .flow-step { transform: none; }
    }
    @media (max-width: 760px) {
      .header { padding: 150px 16px 28px; }
      .logo-container { top: 14px; left: 14px; }
      .top-right-nav { top: 82px; left: 14px; right: 14px; justify-content: center; gap: 7px; }
      .btn-base, .btn-admin, .btn-add, .btn-change-logo, .btn-change-pass { padding: 8px 10px; font-size: .72rem; }
      .header h1 { font-size: 2rem; }
      .header p { line-height: 1.5; }
      .container { margin: 22px auto; padding: 0 14px; }
      .grid { gap: 14px; }
      .card { padding: 18px; }
      .fluxo-row { flex-wrap: wrap; }
      .fluxo-col-nivel, .fluxo-col-fila, .fluxo-col-resp { flex: 1 1 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
    .logo-container { min-width: 160px; background: linear-gradient(145deg, #075da8, #0d3762); }
    .logo-placeholder-text { display: inline-flex; align-items: center; gap: 9px; color: #fff; }
    .logo-identity { display: grid; line-height: 1.05; text-align: left; }
    .logo-identity strong { font-size: .78rem; color: #fff; }
    .logo-identity small { margin-top: 3px; font-size: .61rem; color: #d8ecff; }
    .view-controls { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 14px auto 0; }
    .view-toggle { display: inline-flex; gap: 3px; padding: 3px; border: 1px solid rgba(255,255,255,.38); border-radius: 7px; background: rgba(4,35,57,.28); }
    .view-toggle button, .theme-toggle { min-height: 34px; padding: 7px 12px; border: 0; border-radius: 5px; color: #fff; background: transparent; font: inherit; font-size: .8rem; font-weight: 700; cursor: pointer; }
    .view-toggle button[aria-pressed="true"] { color: var(--deep); background: var(--lime); }
    .theme-toggle { display: inline-flex; align-items: center; gap: 7px; border: 1px solid rgba(255,255,255,.38); background: rgba(4,35,57,.28); }
    .input-clear-wrap { display: flex; gap: 7px; }
    .input-clear-wrap input { min-width: 0; flex: 1; }
    .btn-clear-field { width: 38px; flex: 0 0 38px; border: 1px solid var(--line); border-radius: 5px; color: var(--deep); background: #fff; font-size: 1.2rem; cursor: pointer; }

    .card { transform: none; transform-style: flat; transition: transform .2s ease, box-shadow .25s ease, border-color .25s ease; }
    .card:hover { transform: translateY(-3px); }
    .card > div, .card-title, .badge-access, .flow-step { transform: none; }
    body[data-view-mode="3d"] .card { transform: perspective(1400px) rotateX(var(--rotate-x, 0deg)) rotateY(var(--rotate-y, 0deg)); transform-style: preserve-3d; }
    body[data-view-mode="3d"] .card:hover { transform: perspective(1400px) translateY(-3px) rotateX(var(--rotate-x, 0deg)) rotateY(var(--rotate-y, 0deg)); }
    body[data-view-mode="3d"] .card > div { transform: translateZ(1px); }
    html[data-theme="dark"] body { color: #e4edf5; background: radial-gradient(ellipse at 12% 12%, rgba(18,104,168,.18), transparent 34%), #101923; }
    html[data-theme="dark"] .card { border-color: #2c4358; border-top-color: #68b8f0; background: linear-gradient(145deg, #1c2b39, #15212c); box-shadow: 0 10px 24px rgba(0,0,0,.28); }
    html[data-theme="dark"] .card-title, html[data-theme="dark"] .step-level, html[data-theme="dark"] .step-queue { color: #f1f7f4; }
    html[data-theme="dark"] .card-desc, html[data-theme="dark"] .step-resp { color: #c0d0ca; }
    html[data-theme="dark"] .badge-access { color: #d9edff; background: #29445c; }
    html[data-theme="dark"] .flow-container { border-top-color: #3c5368; }
    html[data-theme="dark"] .flow-step, html[data-theme="dark"] .flow-step.level-1 { color: #edf6fc; background: #203246; border-left-color: #68b8f0; }
    html[data-theme="dark"] .obs-box { color: #ffe4a7; background: #43351d; border-color: #77602c; }
    html[data-theme="dark"] .modal, html[data-theme="dark"] .fluxo-section { color: #e4edf5; background: #172431; border-color: #3c5368; }
    html[data-theme="dark"] .modal h3, html[data-theme="dark"] .form-group label { color: #edf6f2; }
    html[data-theme="dark"] .form-group input, html[data-theme="dark"] .form-group textarea, html[data-theme="dark"] .fluxo-row input { color: #edf6fc; background: #203246; border-color: #4a6279; }
    html[data-theme="dark"] .input-clear-wrap .btn-clear-field { color: #edf6fc; background: #203246; border-color: #4a6279; }
    html[data-theme="dark"] .status-msg { color: #c0d0ca; }
    @media (hover: none), (pointer: coarse) {
      body[data-view-mode="3d"] .card, body[data-view-mode="3d"] .card:hover { transform: none; }
      body[data-view-mode="3d"] .card > div { transform: none; }
    }
    @media (max-width: 760px) {
      .view-controls { flex-wrap: wrap; margin-top: 12px; }
      .logo-container { min-width: 0; }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo-container" id="logoContainer">
      <img id="logoImg" src="" alt="Logo TRT13" style="display: none;">
      <span id="logoText" class="logo-placeholder-text"><span class="logo-identity"><strong>TRT-13</strong><small>40 anos</small></span></span>
    </div>

    <div class="top-right-nav">
      <a href="https://conhecimento-setic.trt13.jus.br/" target="_blank" class="btn-base btn-base-publica">BASE PÚBLICA</a>
      <a href="https://conhecimento-dau.trt13.jus.br/" target="_blank" class="btn-base btn-base-privada">BASE PRIVADA</a>

      <input type="file" id="logoFileInput" accept="image/*" style="display: none;" onchange="handleLogoUpload(event)">
      <button id="btnChangeLogo" class="btn-change-logo" onclick="document.getElementById('logoFileInput').click()">Alterar Logo</button>
      <button id="btnChangePass" class="btn-change-pass" onclick="openChangePassModal()">Alterar Senha</button>

      <button id="btnAdd" class="btn-add" onclick="openEditModal()">+ Novo Sistema</button>
      <button id="btnExportBackup" class="btn-backup" onclick="exportDataBackup()">Exportar backup</button>
      <button id="btnImportBackup" class="btn-backup" onclick="document.getElementById('dataImportInput').click()">Importar backup</button>
      <input type="file" id="dataImportInput" accept="application/json,.json" style="display:none" onchange="importDataBackup(event)">
      <button id="btnLogin" class="btn-admin" onclick="toggleLogin()">Entrar</button>
    </div>

    <h1>FLOW</h1>
    <p>Escalonamento de Filas SETIC TRT-13 — Hierarquia de Atendimento e Responsáveis</p>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar por sistema, módulo, fila ou responsável..." onkeyup="filterCards()">
    </div>
    <div class="view-controls" role="group" aria-label="Modo de visualização">
      <div class="view-toggle">
        <button type="button" id="normalModeButton" aria-pressed="true" onclick="setDisplayMode('normal')">Normal</button>
        <button type="button" id="threeDModeButton" aria-pressed="false" onclick="setDisplayMode('3d')">3D</button>
      </div>
      <button type="button" id="themeToggle" class="theme-toggle" onclick="toggleTheme()" aria-label="Ativar modo escuro">
        <span aria-hidden="true">&#9681;</span><span id="themeToggleText">Escuro</span>
      </button>
    </div>
  </div>

  <div class="container">
    <div id="loading" class="status-msg">Carregando dados do FLOW...</div>
    <div id="cardsContainer" class="grid" style="display:none;"></div>
    <div id="noResults" class="status-msg" style="display:none;">Nenhum registro encontrado para o termo pesquisado.</div>
  </div>

  <!-- Modais -->
  <div id="loginModal" class="modal-overlay">
    <div class="modal" style="max-width: 400px;">
      <h3>Acesso Administrativo</h3>
      <div class="form-group"><label>Usuário</label><input type="text" id="loginUser"></div>
      <div class="form-group"><label>Senha</label><input type="password" id="loginPass"></div>
      <div id="loginError" style="color:red; font-size:0.8rem; display:none; margin-bottom:10px;">Credenciais inválidas.</div>
      <div class="modal-actions">
        <button class="btn-sec" onclick="closeLoginModal()">Cancelar</button>
        <button class="btn-pri" onclick="submitLogin()">Entrar</button>
      </div>
    </div>
  </div>

  <div id="changePassModal" class="modal-overlay">
    <div class="modal" style="max-width: 400px;">
      <h3>Alterar Senha de Admin</h3>
      <div class="form-group"><label>Senha Atual</label><input type="password" id="passAtual"></div>
      <div class="form-group"><label>Nova Senha</label><input type="password" id="passNova"></div>
      <div class="modal-actions">
        <button class="btn-sec" onclick="closeChangePassModal()">Cancelar</button>
        <button class="btn-pri" onclick="submitChangePass()">Salvar Nova Senha</button>
      </div>
    </div>
  </div>

  <div id="editModal" class="modal-overlay">
    <div class="modal">
      <h3 id="modalTitle">Editar Sistema</h3>
      <input type="hidden" id="editId">
      <div class="form-group"><label>Nome do Sistema / Módulo</label><input type="text" id="editNome"></div>
      <div class="form-group"><label>Acesso</label><input type="text" id="editAcesso"></div>
      <div class="form-group"><label>Descrição</label><textarea id="editDesc" rows="2"></textarea></div>
      <div class="form-group"><label>URL / Link</label><input type="text" id="editUrl"></div>
      <div class="form-group"><label for="editResponsavel">Responsável</label><div class="input-clear-wrap"><input type="text" id="editResponsavel"><button type="button" class="btn-clear-field" onclick="document.getElementById('editResponsavel').value = ''" aria-label="Apagar responsável" title="Apagar responsável">&times;</button></div></div>
      <div class="form-group"><label>Observação</label><input type="text" id="editObs"></div>

      <div class="fluxo-section">
        <div class="fluxo-section-header">
          <label>Níveis de Escalonamento</label>
          <button type="button" class="btn-add-fluxo" onclick="addFluxoRow()">+ Adicionar Nível</button>
        </div>
        <div id="fluxoRowsContainer"></div>
      </div>

      <div class="modal-actions">
        <button class="btn-sec" onclick="closeEditModal()">Cancelar</button>
        <button class="btn-pri" onclick="saveItem()">Salvar</button>
      </div>
    </div>
  </div>

  <script>
    let globalData = [];
    let isAdmin = false;

    const DADOS_PADRAO = [
      // Bloco 1 - Sistemas PJe Padrão

    function openAssetDatabase() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) {
          reject(new Error('IndexedDB não está disponível.'));
          return;
        }

        const request = indexedDB.open('flow-assets', 1);
        request.onupgradeneeded = function() {
          if (!request.result.objectStoreNames.contains('assets')) {
            request.result.createObjectStore('assets');
          }
        };
        request.onsuccess = function() { resolve(request.result); };
        request.onerror = function() { reject(request.error); };
      });
    }

    async function storeLogoAsset(src) {
      const database = await openAssetDatabase();
      try {
        await new Promise((resolve, reject) => {
          const transaction = database.transaction('assets', 'readwrite');
          transaction.objectStore('assets').put(src, 'custom-logo');
          transaction.oncomplete = resolve;
          transaction.onerror = function() { reject(transaction.error); };
          transaction.onabort = function() { reject(transaction.error); };
        });
      } finally {
        database.close();
      }
    }

    async function loadLogoAsset() {
      const legacyLogo = localStorage.getItem('flow_custom_logo');
      try {
        const database = await openAssetDatabase();
        let savedLogo;
        try {
          savedLogo = await new Promise((resolve, reject) => {
            const request = database.transaction('assets', 'readonly')
              .objectStore('assets').get('custom-logo');
            request.onsuccess = function() { resolve(request.result || ''); };
            request.onerror = function() { reject(request.error); };
          });
        } finally {
          database.close();
        }

        if (savedLogo) {
          localStorage.removeItem('flow_custom_logo');
          return savedLogo;
        }
        if (legacyLogo) {
          await storeLogoAsset(legacyLogo);
          localStorage.removeItem('flow_custom_logo');
        }
        return legacyLogo || '';
      } catch (error) {
        return legacyLogo || '';
      }
    }

    async function loadData() {
      const storedData = localStorage.getItem("flow_custom_dados_v2") || localStorage.getItem("flow_custom_dados");
      let savedItems = [];
      try {
        const parsedData = storedData ? JSON.parse(storedData) : [];
        savedItems = Array.isArray(parsedData) ? parsedData : [];
      } catch (error) {
        savedItems = [];
      }

      const savedById = new Map(savedItems.map(item => [item.id, item]));
      globalData = DADOS_PADRAO.map(defaultItem => {
        const savedItem = savedById.get(defaultItem.id);
        if (!savedItem) return defaultItem;

        const mergedItem = { ...defaultItem, ...savedItem };

        if (defaultItem.id === "sys_10" && savedItem.sistema === "Prevjud") {
          mergedItem.sistema = defaultItem.sistema;
        }

        const legacyFlow = fluxoPadraoLegado(defaultItem.id);
        if (!Array.isArray(savedItem.fluxo) || savedItem.fluxo.length === 0 ||
            (legacyFlow && JSON.stringify(savedItem.fluxo) === JSON.stringify(legacyFlow))) {
          mergedItem.fluxo = defaultItem.fluxo;
        }
        return mergedItem;
      });

      const knownIds = new Set(DADOS_PADRAO.map(item => item.id));
      globalData.push(...savedItems.filter(item => !knownIds.has(item.id) && !SISTEMAS_REMOVIDOS.has(item.id)));

      const storedLogo = await loadLogoAsset();
      if (storedLogo) displayLogo(storedLogo);

      renderCards(globalData);

    function exportDataBackup() {
      const backup = {
        format: 'flow-data-backup',
        version: 1,
        exportedAt: new Date().toISOString(),
        data: globalData
      };
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `flow-backup-${new Date().toISOString().slice(0, 10)}.json`;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function importDataBackup(event) {
      const file = event.target.files[0];
      if (!file) return;

      try {
        const backup = JSON.parse(await file.text());
        const records = Array.isArray(backup) ? backup : backup?.data;
        if (!Array.isArray(records) || !records.length ||
            records.some(item => !item || typeof item.id !== 'string' || typeof item.sistema !== 'string')) {
          throw new Error('O arquivo não contém uma cópia válida dos dados do FLOW.');
        }

        const seenIds = new Set();
        const hasDuplicateIds = records.some(item => {
          if (seenIds.has(item.id)) return true;
          seenIds.add(item.id);
          return false;
        });
        if (hasDuplicateIds) {
          throw new Error('O backup contém registros duplicados.');
        }

        const restoredData = records.filter(item => !SISTEMAS_REMOVIDOS.has(item.id));
        if (!confirm(`Este backup substituirá os dados deste navegador (${restoredData.length} registros). Deseja continuar?`)) return;
        if (!saveData(restoredData)) return;

        globalData = restoredData;
        renderCards(globalData);
        alert('Backup restaurado com sucesso neste navegador.');
      } catch (error) {
        console.error('Erro ao importar backup:', error);
        alert(error.message || 'Não foi possível ler o arquivo de backup.');
      } finally {
        event.target.value = '';
      }
    }

          });

    function compressLogoImage(file, maxWidth = 800, maxHeight = 800, quality = 0.72) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith('image/')) {
          reject(new Error('Arquivo inválido.'));
          return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const ratio = Math.min(maxWidth / img.width, maxHeight / img.height, 1);
            canvas.width = Math.max(1, Math.round(img.width * ratio));
            canvas.height = Math.max(1, Math.round(img.height * ratio));

            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = function() { reject(new Error('Não foi possível ler a imagem.')); };
          img.src = e.target.result;
        };
        reader.onerror = function() { reject(new Error('Erro ao ler a imagem.')); };
        reader.readAsDataURL(file);
      });
    }

        sistema: nome,
        acesso: document.getElementById('editAcesso').value,
        descricao: document.getElementById('editDesc').value,
        url: document.getElementById('editUrl').value,
        responsavel: document.getElementById('editResponsavel').value.trim(),
        obs: document.getElementById('editObs').value,
        fluxo: fluxos
      };
      const nextData = id
        ? globalData.map(item => item.id === id ? { ...item, ...editedFields } : item)
        : [...globalData, { id: "custom_" + Date.now(), ...editedFields }];

      if (!saveData(nextData)) return;
      globalData = nextData;
      closeEditModal();
      renderCards(globalData);
    }

    function deleteItem(id) {
      if (!confirm('Deseja excluir este registro?')) return;
      const nextData = globalData.filter(x => x.id !== id);
      if (!saveData(nextData)) return;
      globalData = nextData;
      renderCards(globalData);
    }

    function filterCards() {
      const term = document.getElementById('searchInput').value.toLowerCase().trim();
      let visible = 0;
      document.querySelectorAll('.card-item').forEach(item => {
        const text = item.getAttribute('data-search');
        if (text.includes(term)) { item.style.display = 'flex'; visible++; }
        else { item.style.display = 'none'; }
      });
      document.getElementById('noResults').style.display = visible === 0 ? 'block' : 'none';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
